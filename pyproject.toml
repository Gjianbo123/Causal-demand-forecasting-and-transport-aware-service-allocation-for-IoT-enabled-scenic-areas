[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenic-iot-experiment-supplement"
version = "0.1.0"
description = "Fusion ablations and causal telemetry robustness evaluation with a separate synthetic demo"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "matplotlib>=3.8,<4", "torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["iotexp*"]
