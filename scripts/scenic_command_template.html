function business(f){if(view==='traffic'){return head('停车场余位','Parking availability',true)+`<div class="business-body"><div class="parking-grid">${demo.parking.map(p=>`<div class="parking-card"><b>▣ ${p.id}</b><strong>${p.available}<span> / ${p.capacity}</span></strong><span>${T('可用泊位','Available spaces')}</span></div>`).join('')}</div></div>`;}if(['emergency','service'].includes(view)){return head('资源分类台账','Resource ledger')+`<div class="business-body"><div class="service-list">${f.stationary_by_class.map((v,k)=>`<div class="service-row"><span>${T('资源','Class')} C${k+1}</span><span>${v} ${T('驻点','stationary')}</span><strong>${f.transit_by_class[k]} ${T('在途','in transit')}</strong></div>`).join('')}</div></div>`;}if(view==='crowd'){return head('分区排队详情','Selected node')+`<div class="business-body"><div class="service-list"><div class="service-row"><span>${T('当前分区','Service node')}</span><strong>${nn(node)}</strong></div><div class="service-row"><span>${T('当前队列请求','Queued requests')}</span><strong>${f.queue_by_node[node]}</strong></div><div class="service-row"><span>${T('当前流入事件','Observed inflow')}</span><strong>${f.history[node][11]}</strong></div><div class="service-row"><span>${T('60分钟预测','60-min forecast')}</span><strong>${(f.t+6<=72?f.forecast[node][3].toFixed(1):'N/A')}</strong></div></div></div>`;}
 const colors=['#43bdba','#369acb','#d4ac62','#788ca6','#456a7b'];let start=0;let donut='<circle cx="60" cy="60" r="44" fill="none" stroke="#13313e" stroke-width="15"/>';demo.ticket_channels.forEach((v,i)=>{donut+=`<circle cx="60" cy="60" r="44" fill="none" stroke="${colors[i]}" stroke-width="15" stroke-dasharray="${v/100*276.46} 276.46" stroke-dashoffset="${-start/100*276.46}" transform="rotate(-90 60 60)"/>`;start+=v;});donut+=svgText(60,60,T('售票','Tickets'),14,'#85aebc','text-anchor="middle"')+svgText(60,81,'24,312',20,'#e9ca91','text-anchor="middle"');return head('票务渠道与营收','Ticketing channels',true)+`<div class="business-body"><svg class="donut" viewBox="0 0 120 120">${donut}</svg><div class="channel-list">${demo.ticket_channels.slice(0,3).map((p,i)=>`<div class="channel"><span><i style="background:${colors[i]}"></i>${[T('OTA平台','OTA'),T('官方预约','Direct'),T('线下窗口','On-site')][i]}</span><span>${p}%</span></div>`).join('')}<div class="channel-total">¥ 1,286,520</div></div></div>`;}
function weatherIcon(k){return `<svg viewBox="0 0 48 40" fill="none" stroke="currentColor" stroke-width="2">${k==='sun'?'<circle cx="31" cy="13" r="7" fill="#d7b667" stroke="#d7b667"/><path d="M31 1v3m0 18v3m-12-12h3m18 0h3M22 4l2 2m14 14 2 2m0-18-2 2" stroke="#dfbf74"/>':''}<path d="M11 29h24a7 7 0 0 0 0-14 11 11 0 0 0-21-2 8 8 0 0 0-3 16Z" fill="#a7c9d8" stroke="#a7c9d8"/>${k==='rain'?'<path d="m17 34-2 4m11-4-2 4m11-4-2 4" stroke="#5bb5e1"/>':''}</svg>`;}
function rightTop(f){if(view==='traffic'){return head('交通接驳保障','Shuttle overview',true)+`<div class="business-body"><div class="service-list"><div class="service-row"><span>${T('在线接驳车辆','Shuttles available')}</span><strong>12 / 16</strong></div><div class="service-row"><span>${T('建议等待时间','Example headway')}</span><strong>8 ${T('分钟','min')}</strong></div><div class="service-row"><span>${T('停车总余位','Open parking bays')}</span><strong>420</strong></div></div></div>`;}if(view==='tickets'){return head('预约与票务概览','Ticketing overview',true)+`<div class="business-body"><div class="service-list"><div class="service-row"><span>${T('今日预约','Reservations')}</span><strong>28,465</strong></div><div class="service-row"><span>${T('今日售票','Tickets sold')}</span><strong>24,312</strong></div><div class="service-row"><span>${T('人均消费','Spend / visitor')}</span><strong>¥178.6</strong></div></div></div>`;}return head('天气与运营提示','Weather outlook',true)+`<div class="weather-cards">${demo.weather.map((w,i)=>`<div class="weather-day">${[T('今日','Today'),T('明日','Day 2'),T('后日','Day 3')][i]}${weatherIcon(w.condition)}${w.temperature}°C<small>${[T('多云','Cloudy'),T('晴间多云','Partly cloudy'),T('阵雨','Showers')][i]}</small></div>`).join('')}</div><div class="weather-foot"><span>◉ ${T('步道巡查提示','Trail checks')}</span><span>${T('示例预案','Example only')}</span></div>`;}
function eventName(k){return {assistance:T('游客求助','Visitor assistance'),equipment:T('设备报修','Equipment issue'),lost:T('物品遗失','Lost property')}[k];}function eventStatus(i){return [T('待派发','Pending'),T('处置中','In progress'),T('已关闭','Closed')][i];}
function events(){return incidents.map((e,i)=>`<button class="event-row" data-event="${i}"><span class="event-icon">${['!','⚙','i'][i]}</span><span class="event-info"><b>${eventName(e.kind)}</b><span>${nn(e.node)} · ${e.id} · ${e.time}</span></span><span class="event-status ${e.status===2?'done':''}">${eventStatus(e.status)}</span></button>`).join('');}
function transfers(f){return f.moves.length?`<table class="transfer-table"><thead><tr><th>${T('资源','Class')}</th><th>${T('转移路线','Route')}</th><th>${T('数量','Qty')}</th><th>${T('用时','Travel')}</th></tr></thead><tbody id="transfers">${f.moves.map(m=>`<tr><td>C${m.resource}</td><td>${nn(m.origin)} → ${nn(m.destination)}</td><td>${m.units}</td><td>${m.transit_minutes} ${T('分','min')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${T('本时点保持当前配置','Hold current allocation')}</div>`;}
function activityName(k){return {heritage:T('非遗民俗表演','Heritage performance'),nature:T('自然科普讲解','Nature interpretation'),forest:T('竹林瑜伽体验','Forest wellness'),valley:T('峡谷探秘导览','Valley guided walk'),music:T('星空音乐会','Evening concert')}[k];}
function fit(){let s=Math.min(innerWidth/1680,innerHeight/1000);app.style.transform=`scale(${s})`;$('viewport').style.width=1680*s+'px';$('viewport').style.height=1000*s+'px';}
function drawMap(f){$('scenic-map').innerHTML=window.scenicMapMarkup(f,node,lang,layers);$('scenic-map').setAttribute('viewBox',`${500-500/zoom} ${345-345/zoom} ${1000/zoom} ${690/zoom}`);$('scenic-map').querySelectorAll('[data-node]').forEach(g=>{g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',nn(Number(g.dataset.node)));const choose=()=>{node=Number(g.dataset.node);render();};g.onclick=choose;g.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();choose();}};});}
function render(){const f=data.frames[step];app.className=lang==='en'?'en':'';document.documentElement.lang=lang==='zh'?'zh-CN':'en';app.innerHTML=`<header class="topbar"><div class="brand"><svg viewBox="0 0 46 46" fill="none" stroke="#71d0d7" stroke-width="1.6"><path d="M5 33 17 9l9 17 6-11 10 18Z"/><path d="M8 38h30M10 29l7-13 8 17M25 31l7-11 7 13"/><circle cx="35" cy="8" r="3" fill="#deb778" stroke="none"/></svg><div><h1>${T('智慧景区文旅运营指挥平台','Scenic Operations Command')}</h1><p>${T('客流监测 · 预测研判 · 资源调度','MONITORING · FORECASTS · DISPATCH')}</p></div></div><nav class="nav" aria-label="${T('业务导航','Business navigation')}">${names.map((v,i)=>`<button data-view="${v}" class="${v===view?'active':''}">${(lang==='zh'?navZh:navEn)[i]}</button>`).join('')}</nav><div class="tools"><span class="demo-tag">${T('离线演示 · 合成数据','Offline prototype')}</span><button class="mini-btn" id="language">${T('EN','中文')}</button><button class="mini-btn" id="fullscreen" aria-label="${T('全屏','Fullscreen')}">⛶</button></div></header>
<div class="content"><aside class="side"><section class="panel rank-panel">${head('景区分区排队 TOP 5','Queue pressure · Top 5')}<div class="rank-head"><span>#</span><span>${T('服务分区','Service zone')}</span><span>${T('请求','Queue')}</span><span>${T('相对负荷','Relative load')}</span></div><div id="ranking">${rank(f)}</div><div class="rank-note">${T('统计口径：服务请求，非在园人数','Service requests, not visitor occupancy')}</div></section><section class="panel forecast-panel">${head(view==='crowd'?'节点客流预测':'客流观测与预测',view==='crowd'?'Node inflow forecast':'Inflow & forecast')}<svg id="forecast" class="forecast-svg" viewBox="0 0 310 159" aria-label="${T('流入历史与预测','Observed and forecast inflow')}">${forecastChart(f)}</svg><div class="chart-legend"><span><i></i>${T('观测','Observed')}</span><span><i class="future"></i>${(f.t+6<=72?T('未来60分钟','Next 60 min'):T('营业时段内预测','Before closing'))}</span></div></section><section class="panel business-panel" id="business">${business(f)}</section></aside>
<section class="center"><div class="kpis">${[[T('今日预约','Reservations'),demo.reservations.toLocaleString('en'),T('界面示例','UI example'),'calendar'],[T('本时点流入','Observed inflow'),f.inflow,T('次 / 10分钟 · 回放','events / 10 min · replay'),'people'],[T('排队请求','Queued requests'),f.queued,T('16个服务节点 · 回放','16 service nodes · replay'),'queue'],[T('驻点 / 在途','Stationary / transit'),f.stationary+' / '+f.in_transit,T('82个资源单位 · 回放','82 resource units · replay'),'resource'],[T('可执行转移','Transfers'),f.moves.length,T('当前决策 · 回放','Current step · replay'),'route']].map(([label,val,sub,ico],i)=>`<div class="kpi"><div class="kpi-icon">${icon(ico)}</div><div><div class="label">${label}</div><strong ${i===1?'id="inflow"':i===2?'id="queue"':''}>${val}</strong><div class="sub">${sub}</div></div></div>`).join('')}</div><div class="map-panel"><div class="map-toolbar"><span class="map-tag map-title">${T('全域运营态势','Scenic operations map')}</span><span class="map-tag">${T('示意地图 · 24节点 / 31连接','Schematic · 24 nodes / 31 links')}</span></div><div class="map-actions"><button id="zoom-in" aria-label="${T('放大地图','Zoom in')}">+</button><button id="zoom-out" aria-label="${T('缩小地图','Zoom out')}">−</button><button class="home" id="reset-map" aria-label="${T('复位地图','Reset map')}">⌖</button></div><svg id="scenic-map" viewBox="0 0 1000 690" role="img" aria-label="${T('景区地形与服务网络示意','Schematic terrain and scenic service network')}"></svg><div class="node-popup"><div class="node-title"><b>${nn(node)} ${T('节点','node')}</b><select id="node" aria-label="${T('选择节点','Select node')}">${Array.from({length:24},(_,i)=>`<option value="${i}" ${i===node?'selected':''}>${nn(i)}</option>`).join('')}</select></div><div class="node-stats"><div><span>${T('排队请求','Queue')}</span><strong>${f.queue_by_node[node]}</strong></div><div><span>${T('60分钟预测','60-min inflow')}</span><strong>${(f.t+6<=72?f.forecast[node][3].toFixed(1):'N/A')}</strong></div></div><div class="caption">${(f.t+6<=72?T('节点记录 · 点击地图切换','Recorded state · Select a map node'):T('60分钟预测超出营业时段','60-min lead is after closing'))}</div></div><div class="map-legend"><h3>${T('地图图层','Map layers')}</h3>${[['routes',T('步道与网络','Paths & links')],['heat',T('排队热点','Queue hotspots')],['resources',T('资源转移','Transfers')]].map(([k,n])=>`<label><input type="checkbox" data-layer="${k}" ${layers[k]?'checked':''}>${n}</label>`).join('')}<div class="hint">S: ${T('服务点','service')} · H: ${T('枢纽','hub')}<br>G: ${T('出入口','gate')}</div></div></div></section>
<aside class="side"><section class="panel weather-panel" id="right-top">${rightTop(f)}</section><section class="panel events-panel">${head('事件与游客服务','Incidents & service',true)}<div id="events">${events()}</div><div class="events-foot"><span>${T('点击事件查看处置流程','Select an incident for its timeline')}</span><span>↗</span></div></section><section class="panel dispatch-panel">${head('资源调度计划','Transfer plan')}<div class="table-wrap">${transfers(f)}</div></section></aside></div>
<section class="panel activity-panel"><div class="activity-label"><h2>${T('活动日程','Activities')}</h2>${source(true)}</div><div class="activities">${demo.activities.map(a=>`<div class="activity"><time>${a.time}</time><span class="status-chip ${a.status===1?'live':''}">${[T('未开始','Planned'),T('进行中','Active'),T('已结束','Ended')][a.status]}</span><b>${activityName(a.key)}</b></div>`).join('')}</div></section>
<footer class="bottom"><span class="replay-label">${T('仿真回放','Simulation replay')}</span><button class="play" id="play" aria-label="${T('播放或暂停回放','Play or pause replay')}">${playing?'Ⅱ':'▶'}</button><span id="step-value">t = ${step}</span><input type="range" id="step" min="0" max="71" value="${step}" aria-label="${T('决策时点','Decision step')}"><span>${T('10分钟 / 步','10 min / step')}</span><span class="spacer"></span><span><i class="live-dot"></i>${T('世界','World')} 20261011 · ${T('第','Day')} 153 ${T('日','')} · ${T('常规负荷','Nominal')}</span><span>${T('外生流入 / 配置影响队列','Exogenous inflow / allocation-dependent queues')}</span><button class="mini-btn" id="export">${T('导出状态','Export')}</button></footer><div class="toast" id="toast" hidden></div><div class="modal-backdrop" id="modal" hidden></div>`;
drawMap(f);bind();fit();window.currentReplayState=f;window.dashboardState={lang,view,step,node,zoom,layers};window.dashboardReady=true;if(modalEvent!==null)showEvent(modalEvent);}
function bind(){app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render();};$('step').oninput=e=>{step=Number(e.target.value);render();};$('node').onchange=e=>{node=Number(e.target.value);render();};app.querySelectorAll('[data-select-node]').forEach(b=>b.onclick=()=>{node=Number(b.dataset.selectNode);render();});app.querySelectorAll('[data-layer]').forEach(e=>e.onchange=()=>{layers[e.dataset.layer]=e.checked;drawMap(data.frames[step]);window.dashboardState.layers={...layers};});app.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{modalEvent=Number(b.dataset.event);showEvent(modalEvent);});$('zoom-in').onclick=()=>{zoom=Math.min(1.6,zoom+.15);drawMap(data.frames[step]);window.dashboardState.zoom=zoom;};$('zoom-out').onclick=()=>{zoom=Math.max(1,zoom-.15);drawMap(data.frames[step]);window.dashboardState.zoom=zoom;};$('reset-map').onclick=()=>{zoom=1;drawMap(data.frames[step]);window.dashboardState.zoom=zoom;};$('export').onclick=exportState;$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){toast(T('当前浏览器不支持全屏，可按F11','Fullscreen unavailable; try F11'));}};$('play').onclick=()=>{if(playing){clearInterval(playing);playing=null;}else{if(step===71)step=0;playing=setInterval(()=>{if(step>=71){clearInterval(playing);playing=null;}else step++;render();},1000);}render();};}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;setTimeout(()=>{if($('toast'))$('toast').hidden=true;},2200);}
function showEvent(i){const e=incidents[i];$('modal').hidden=false;$('modal').innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${T('事件处置演示','Incident workflow example')}"><div class="dialog-head"><h2>${eventName(e.kind)} · ${e.id}</h2><button class="close" id="close-modal" aria-label="${T('关闭','Close')}">×</button></div>${source(true)}<p>${T('此流程用于界面交互演示。操作仅更新当前页面中的示例状态，不会派发真实资源或发送通知。','This workflow updates only the illustrative incident in this browser. It does not dispatch resources or send notifications.')}</p><div class="info-grid"><div>${T('关联节点','Location')}<strong>${nn(e.node)}</strong></div><div>${T('接报时间','Reported')}<strong>${e.time}</strong></div><div>${T('当前状态','Status')}<strong>${eventStatus(e.status)}</strong></div></div><div class="timeline">${[T('接报','Reported'),T('派发','Assigned'),T('处置','Responding'),T('关闭','Closed')].map((s,j)=>`<div class="timeline-step ${j<=(e.status===0?0:e.status===1?2:3)?'passed':''}">${s}</div>`).join('')}</div><div class="dialog-actions"><button class="mini-btn" id="locate-event">${T('定位节点','Locate node')}</button><button class="primary" id="advance-event" ${e.status===2?'disabled':''}>${e.status===0?T('模拟派发','Simulate assignment'):e.status===1?T('模拟办结','Simulate resolution'):T('示例已关闭','Example closed')}</button></div></div>`;$('close-modal').onclick=()=>{modalEvent=null;$('modal').hidden=true;};$('modal').onclick=e=>{if(e.target===$('modal')){modalEvent=null;$('modal').hidden=true;}};$('locate-event').onclick=()=>{node=e.node;modalEvent=null;render();};$('advance-event').onclick=()=>{e.status=Math.min(2,e.status+1);render();};$('close-modal').focus();}
function exportState(){const payload={kind:'offline_ui_state',world:data.world,physical_day:data.physical_day,view,selected_node:nn(node),simulation_record:data.frames[step],illustrative_scenario:{...demo,incidents},map:'schematic, not surveyed geography'};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=`scenic-command-t${step}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast(T('状态已导出：仿真记录与示例数据分开保存','Exported: simulation and illustrative fields are separate'));}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalEvent!==null){modalEvent=null;$('modal').hidden=true;}});addEventListener('resize',fit);render();
</script></body></html>
